<!DOCTYPE html>
<html class="h-full" lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>履歴書 | ITF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Local stylesheet to avoid CORS/fonts -->
  <link rel="stylesheet" href="css/rireki.css" media="screen" />
</head>

<body class="h-full rf-body">
  <main class="rf-main">
    <div>
      <form class="rf-form" id="rf-form" novalidate="novalidate" enctype="multipart/form-data"
            action="/resumes" accept-charset="UTF-8" method="post">
        <input type="hidden" name="authenticity_token"
               value="JGzZBUc8n3GFO5HRca5SW9IFZvQnlBuxAKiXUx3ppkeg86C7X2U_ytQEg-3y5Cr2g6AVa5PlslHBXybg_xoRLQ"
               autocomplete="off" />

        <!-- 基本情報 -->
        <table class="rf-table rf-table-basic">
          <tr class="rf-header-row">
            <td colspan="2">
              <h1 class="rf-title">履歴書</h1>
              <div class="rf-current-date">
                <div>
                  <select id="rf-current-year" name="resume_form[current_date_year]"></select>
                  <span>年</span>
                  <select id="rf-current-month" name="resume_form[current_date_month]"></select>
                  <span>月</span>
                  <select id="rf-current-day" name="resume_form[current_date_day]"></select>
                  <span>日</span><span>現在</span>
                </div>
              </div>
            </td>
            <td class="rf-photo-cell" rowspan="4">
              <article id="rf-photo-area" aria-label="写真アップロード">
                <div id="rf-photo-placeholder">
                  <div>写真を貼る位置</div>
                  <div>写真を貼る必要がある場合</div>
                  <div>1. 縦 36～40mm</div>
                  <div>横 24～30mm</div>
                  <div>2. 本人単身胸から上</div>
                  <div>3. 裏面のりづけ</div>
                  <div>&nbsp;</div>
                  <p>(Upload or drag & drop)</p>
                </div>
                <img id="rf-photo-preview" style="display:none; width:100%; height:100%; object-fit:cover;" />
              </article>
              <div class="rf-photo-input-wrap">
                <input class="rf-file" accept="image/*" style="display:none;" id="rf-photo-input" type="file" name="resume_form[image]" />
              </div>
            </td>
          </tr>

          <tr>
            <th><label for="rf-name-kana">フリガナ</label></th>
            <td>
              <div class="rf-input-wrap">
                <input class="rf-input" placeholder="レ　ミー　チエン　トアン" type="text" name="resume_form[name_kana]" id="rf-name-kana" />
              </div>
            </td>
          </tr>

          <tr>
            <th><label for="rf-name">氏名</label></th>
            <td>
              <div class="rf-input-wrap">
                <input class="rf-input" placeholder="LE MINH THIEN TOAN" type="text" name="resume_form[name]" id="rf-name" />
              </div>
            </td>
          </tr>

          <tr>
            <th></th>
            <td>
              <div class="rf-birthday">
                <select id="rf-birth-year" name="resume_form[birthday_year]"></select>
                <span>年</span>
                <select id="rf-birth-month" name="resume_form[birthday_month]"></select>
                <span>月</span>
                <select id="rf-birth-day" name="resume_form[birthday_day]"></select>
                <span>日生（満</span><span id="rf-age"></span><span>歳）</span>
              </div>

              <div class="rf-gender">
                <label>性別</label>
                <div class="rf-radio-group">
                  <input type="hidden" name="resume_form[gender]" value="" autocomplete="off" />
                  <label class="rf-radio">
                    <input class="rf-radio-input" type="radio" value="male" name="resume_form[gender]" />男
                  </label>
                  <label class="rf-radio">
                    <input class="rf-radio-input" type="radio" value="female" name="resume_form[gender]" />女
                  </label>
                </div>
              </div>
            </td>
          </tr>

          <tr>
            <th><label for="rf-address-kana">フリガナ</label></th>
            <td>
              <div class="rf-input-wrap">
                <input class="rf-input" placeholder="トウキョウト　シブヤク　シブヤニチョウメ" type="text" name="resume_form[address_kana]" id="rf-address-kana" />
              </div>
            </td>
            <td>
              <div class="rf-input-group">
                <label for="rf-tel" class="rf-label-inline">電話</label>
                <input class="rf-input" placeholder="090-1234-5678" type="text" name="resume_form[tel]" id="rf-tel" />
              </div>
            </td>
          </tr>

          <tr>
            <th><label for="rf-postal">現住所</label></th>
            <td class="h-adr">
              <div class="rf-postal">
                <label>〒</label><span class="p-country-name" style="display:none;">Japan</span>
                <input class="rf-input p-postal-code" placeholder="150-0022" type="text" name="resume_form[postal_code]" id="rf-postal" />
              </div>
              <div class="rf-input-wrap">
                <textarea rows="2" class="rf-textarea p-region p-locality p-street-address p-extended-address"
                          data-kana-target="#rf-address-kana" placeholder="東京都渋谷区渋谷2丁目２４−１２"
                          name="resume_form[address]" id="rf-address"></textarea>
              </div>
            </td>
            <td>
              <label for="rf-email" class="rf-label-inline">メール</label>
              <input class="rf-input" placeholder="leminh.thientoan@gmail.com" type="email" name="resume_form[email]" id="rf-email" />
            </td>
          </tr>

          <tr>
            <th><label for="rf-contact-address-kana">フリガナ</label></th>
            <td>
              <div class="rf-input-wrap">
                <input class="rf-input" type="text" name="resume_form[contact_address_kana]" id="rf-contact-address-kana" />
              </div>
            </td>
            <td>
              <div class="rf-input-group">
                <label for="rf-contact-tel" class="rf-label-inline">電話</label>
                <input class="rf-input" type="text" name="resume_form[contact_tel]" id="rf-contact-tel" />
              </div>
            </td>
          </tr>

          <tr>
            <th><label for="rf-contact-postal">連絡先</label></th>
            <td class="h-adr">
              <div class="rf-postal">
                <label>〒</label><span class="p-country-name" style="display:none;">Japan</span>
                <input class="rf-input p-postal-code" type="text" name="resume_form[contact_postal_code]" id="rf-contact-postal" />
                <span class="rf-note">（現住所以外に連絡を希望する場合のみ記入）</span>
              </div>
              <div class="rf-input-wrap">
                <textarea rows="2" class="rf-textarea p-region p-locality p-street-address p-extended-address"
                          data-kana-target="#rf-contact-address-kana"
                          name="resume_form[contact_address]" id="rf-contact-address"></textarea>
              </div>
            </td>
            <td>
              <label for="rf-contact-email" class="rf-label-inline">メール</label>
              <input class="rf-input" type="email" name="resume_form[contact_email]" id="rf-contact-email" />
            </td>
          </tr>
        </table>

        <!-- 学歴 -->
        <div class="rf-section" id="rf-education">
          <table class="rf-table">
            <thead>
              <tr><th>年</th><th>月</th><th>学歴</th></tr>
            </thead>
            <tbody id="rf-edu-tbody"></tbody>
          </table>
          <div class="rf-links">
            <a href="#" class="rf-add-row" data-section="education">＋ 学歴を追加</a>
          </div>
        </div>

        <!-- 職歴 -->
        <div class="rf-section" id="rf-employment">
          <table class="rf-table">
            <thead>
              <tr><th>年</th><th>月</th><th>職歴</th></tr>
            </thead>
            <tbody id="rf-job-tbody"></tbody>
          </table>
          <div class="rf-links">
            <a href="#" class="rf-add-row" data-section="employment">＋ 職歴を追加</a>
          </div>
        </div>

        <!-- 免許・資格 -->
        <div class="rf-section" id="rf-certificates">
          <table class="rf-table">
            <thead>
              <tr><th>年</th><th>月</th><th>免許・資格</th></tr>
            </thead>
            <tbody id="rf-cert-tbody"></tbody>
          </table>
          <div class="rf-links">
            <a href="#" class="rf-add-row" data-section="certificates">＋ 免許・資格を追加</a>
          </div>
        </div>

        <!-- 自己PR・本人希望 -->
        <table class="rf-table rf-table-intro">
          <tbody>
            <tr>
              <td class="rf-intro-cell" rowspan="3">
                <label for="rf-introduce">志望の動機、自己 PR など</label>
                <textarea class="rf-textarea" placeholder="志望動機や自己PRを具体的にご記入ください" name="resume_form[introduce]" id="rf-introduce"></textarea>
              </td>
              <td>
                <label for="rf-commute-hour">通勤時間</label>
                <div class="rf-inline">
                  <span>約</span>
                  <input min="0" max="23" class="rf-input rf-input-number" type="number" step="1" name="resume_form[desired_commute_hour]" id="rf-commute-hour" />
                  <span>時間</span>
                  <input min="0" max="59" class="rf-input rf-input-number" type="number" step="1" name="resume_form[desired_commute_minute]" id="rf-commute-minute" />
                  <span>分</span>
                </div>
              </td>
            </tr>
            <tr>
              <td>
                <label for="rf-dependent">扶養家族数（配偶者を除く）</label>
                <div class="rf-inline">
                  <input min="0" class="rf-input rf-input-number" type="number" step="1" name="resume_form[dependent_count]" id="rf-dependent" />
                  <span>人</span>
                </div>
              </td>
            </tr>
            <tr>
              <td>
                <div class="rf-inline rf-spouse">
                  <span>配偶者</span>
                  <label class="rf-radio"><input class="rf-radio-input" type="radio" value="true"  name="resume_form[spouse]" />有</label>
                  <label class="rf-radio"><input class="rf-radio-input" type="radio" value="false" name="resume_form[spouse]" />無</label>
                </div>
                <div class="rf-inline rf-spouse-obligation">
                  <span>配偶者の扶養義務</span>
                  <label class="rf-radio"><input class="rf-radio-input" type="radio" value="true"  name="resume_form[spouse_obligation]" />有</label>
                  <label class="rf-radio"><input class="rf-radio-input" type="radio" value="false" name="resume_form[spouse_obligation]" />無</label>
                </div>
              </td>
            </tr>
          </tbody>
        </table>

        <table class="rf-table rf-table-personal">
          <thead>
            <tr>
              <td><label for="rf-personal-desires">本人希望記入欄 （特に給料、職種、勤務時間、勤務地、その他についての希望などがあれば記入）</label></td>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <textarea class="rf-textarea" placeholder="希望する勤務条件や勤務地などをご記入ください" name="resume_form[personal_desires]" id="rf-personal-desires"></textarea>
              </td>
            </tr>
          </tbody>
        </table>
      </form>
    </div>
  </main>

  <!-- Libraries you already use -->
  <script charset="UTF-8" src="https://yubinbango.github.io/yubinbango/yubinbango.js"></script>
  <script src="/js/jquery-3.7.1.min.js"></script>
  <script src="/js/html2pdf.bundle.min.js"></script>

  <!-- Local logic -->
  <script src="js/rireki.js"></script>
</body>
</html>
