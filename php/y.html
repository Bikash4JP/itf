<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スタッフ情報フォーム</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #fff;
      margin: 0;
      padding: 20px;
    }

    .form-container {
      width: 70%;
      margin: auto;
      background: #fff;
      padding: 20px 40px;
      border-radius: 8px;
      box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
    }

    .step-header {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }

    .step-header .arrow {
      font-size: 22px;
      margin-right: 8px;
      color: #000;
    }

    .step-title {
      font-size: 18px;
      font-weight: bold;
      color: #4169e1;
      padding: 5px 15px;
      background: #f5f7fc;
      border-radius: 4px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: #ddd;
      margin: 15px 0 25px;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #4169e1;
      transition: width 0.3s ease;
    }

    .form-step {
      display: none;
    }

    .form-step.active {
      display: block;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 8px;
      border: 1px solid #1e90ff;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .form-navigation {
      text-align: center;
      margin-top: 20px;
    }

    .btn {
      padding: 8px 18px;
      margin: 0 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-next {
      background: #4169e1;
      color: white;
    }

    .btn-back {
      background: #ccc;
      color: #000;
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <!-- Step Header -->
    <div class="step-header">
      <span class="arrow">»</span>
      <span class="step-title" id="stepTitle">個人情報</span>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>

    <!-- Form -->
    <form id="staffForm">
      <!-- Step 1: 個人情報 -->
      <div class="form-step active">
        <div class="form-grid">
          <div>
            <label>お名前（アルファベット）</label>
            <input type="text">
          </div>
          <div>
            <label>お名前（カタカナ）</label>
            <input type="text">
          </div>
          <div>
            <label>生年月日</label>
            <input type="date">
          </div>
          <div>
            <label>支援者住所</label>
            <input type="text">
          </div>
          <div>
            <label>連絡先①</label>
            <input type="text">
          </div>
          <div>
            <label>性別</label>
            <input type="text">
          </div>
          <div>
            <label>国籍</label>
            <input type="text">
          </div>
          <div>
            <label>年齢</label>
            <input type="number">
          </div>
        </div>
      </div>

      <!-- Step 2: 会社情報 -->
      <div class="form-step">
        <div class="form-grid">
          <div>
            <label>施設名（勤務先）</label>
            <select>
              <option>選択してください</option>
              <option>会社A</option>
              <option>会社B</option>
            </select>
          </div>
          <div>
            <label>入社日</label>
            <input type="date">
          </div>
          <div>
            <label>支援退職日</label>
            <input type="date">
          </div>
          <div>
            <label>状態</label>
            <select>
              <option>選択してください</option>
              <option>在籍中</option>
              <option>退職</option>
            </select>
          </div>
          <div>
            <label>エリア</label>
            <select>
              <option>選択してください</option>
              <option>東京</option>
              <option>大阪</option>
            </select>
          </div>
          <div>
            <label>受け入れ期間</label>
            <input type="text">
          </div>
          <div>
            <label>受入機関（郵便番号）</label>
            <input type="text">
          </div>
          <div>
            <label>受入機関（電話番号）</label>
            <input type="text">
          </div>
        </div>
      </div>

      <!-- Step 3: 追加情報 -->
      <div class="form-step">
        <div class="form-grid">
          <div>
            <label>雇用者在留番号</label>
            <input type="text">
          </div>
          <div>
            <label>雇用者在留期限</label>
            <input type="date">
          </div>
          <div>
            <label>更新回数</label>
            <input type="number">
          </div>
          <div>
            <label>管理番号</label>
            <input type="text">
          </div>
          <div>
            <label>担当責任者</label>
            <input type="text">
          </div>
          <div>
            <label>正担当者</label>
            <input type="text">
          </div>
          <div>
            <label>紹介元</label>
            <input type="text">
          </div>
          <div>
            <label>住居タイプ</label>
            <input type="text">
          </div>
        </div>
      </div>

      <!-- Step 4: ビジネス情報 -->
      <div class="form-step">
        <div class="form-grid">
          <div>
            <label>管理費</label>
            <input type="number">
          </div>
          <div>
            <label>紹介料</label>
            <input type="number">
          </div>
          <div>
            <label>基本契約書</label>
            <input type="text">
          </div>
          <div>
            <label>委託契約書</label>
            <input type="text">
          </div>
          <div>
            <label>担当者（企業）</label>
            <input type="text">
          </div>
        </div>
      </div>

      <!-- Navigation -->
      <div class="form-navigation">
        <button type="button" class="btn btn-back" id="prevBtn" onclick="prevStep()" style="display:none;">戻る</button>
        <button type="button" class="btn btn-next" id="nextBtn" onclick="nextStep()">次へ</button>
      </div>
    </form>
  </div>

  <script>
    const steps = document.querySelectorAll(".form-step");
    const progress = document.getElementById("progress");
    const stepTitle = document.getElementById("stepTitle");
    const titles = ["個人情報", "会社情報", "追加情報", "ビジネス情報"];

    let currentStep = 0;

    function showStep(step) {
      steps.forEach((s, i) => {
        s.classList.toggle("active", i === step);
      });
      stepTitle.textContent = titles[step];
      progress.style.width = ((step+1) / steps.length) * 100 + "%";
      document.getElementById("prevBtn").style.display = step > 0 ? "inline-block" : "none";
      document.getElementById("nextBtn").textContent = step === steps.length-1 ? "送信" : "次へ";
    }

    function nextStep() {
      if (currentStep < steps.length-1) {
        currentStep++;
        showStep(currentStep);
      } else {
        alert("フォーム送信！");
        document.getElementById("staffForm").submit();
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        showStep(currentStep);
      }
    }
  </script>
</body>
</html>
